version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must move together: a bump of one without the other
      # fails the build (react-dom pins an exact react version). Their types are
      # versioned alongside them, so they ride in the same PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
