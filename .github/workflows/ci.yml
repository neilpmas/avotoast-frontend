name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  # Lets you re-run CI by hand on main, which also re-triggers anything that
  # hangs off CI completing (e.g. a deploy workflow_run).
  workflow_dispatch: {}

# Least privilege: CI only reads the repo. Without this block the token gets
# the repo default, which CodeQL flags as actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
