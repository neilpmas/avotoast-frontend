name: Dependabot auto-merge

on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A merge made with GITHUB_TOKEN does not trigger workflows (GitHub's
          # rule against recursive runs), so CI and deploy never run on main
          # for these merges. A PAT counts as a real user's push, so they do.
          # Opt-in: with no DEPENDABOT_PAT secret this falls back to
          # GITHUB_TOKEN and behaves as before. This job runs as dependabot[bot],
          # so the secret must be in the *Dependabot* secret store
          # (Settings -> Secrets and variables -> Dependabot), not Actions.
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}
